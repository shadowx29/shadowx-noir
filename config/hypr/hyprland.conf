# ═══════════════════════════════════════════════════════════════
#  SHADOWX // NOIR  —  Hyprland configuration
#  Written from scratch for Kali Linux / Intel iGPU
# ═══════════════════════════════════════════════════════════════

# ── Autostart ──────────────────────────────────────────────────
exec-once = waybar
exec-once = swaybg -i $HOME/.config/shadowx/wallpaper.current -m fill
exec-once = dunst
exec-once = swayidle -w timeout 300 "$HOME/.config/scripts/lock.sh" timeout 600 "hyprctl dispatch dpms off" resume "hyprctl dispatch dpms on" &
exec-once = polkit-kde-authentication-agent-1 &
exec-once = nm-applet --indicator &

# ── Look ───────────────────────────────────────────────────────
general {
    gaps_in = 6
    gaps_out = 12
    border_size = 2
    col.active_border = rgba(cc1515ff)
    col.inactive_border = rgba(2a2a30ff)
    layout = dwindle
}

decoration {
    rounding = 0
    drop_shadow = true
    shadow_range = 16
    shadow_render_power = 2
    col.shadow = rgba(00000099)

    # Keep composition cheap on integrated graphics.
    blur {
        enabled = false
    }
}

animations {
    enabled = true
    animation = windows, 1, 4, default
    animation = workspaces, 1, 3, default
}

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    disable_hyprland_logo = true
    vrr = 0
}

# ── Keys — mirrored from your current XFCE shortcuts ───────────
# Menus / run dialogs
bind = ALT, F1, exec, rofi -show drun -theme $HOME/.config/rofi/shadowx.rasi
bind = ALT, F2, exec, rofi -show run -theme $HOME/.config/rofi/shadowx.rasi
bind = ALT, F3, exec, rofi -show drun -theme $HOME/.config/rofi/shadowx.rasi
bind = CTRL, Escape, exec, rofi -show drun -theme $HOME/.config/rofi/shadowx.rasi
bind = SUPER, R, exec, rofi -show run -theme $HOME/.config/rofi/shadowx.rasi
bind = SUPER, Space, exec, rofi -show drun -theme $HOME/.config/rofi/shadowx.rasi

# Terminal — your existing Ghostty (config left untouched)
bind = CTRL ALT, T, exec, ghostty --gtk-single-instance=true
bind = CTRL SHIFT ALT, T, exec, ghostty --gtk-single-instance=true
bind = SUPER, Return, exec, ghostty --gtk-single-instance=true
bind = SUPER, T, exec, ghostty --gtk-single-instance=true

# Files / web / apps
bind = CTRL ALT, F, exec, nautilus
bind = SUPER, E, exec, nautilus
bind = SUPER, F, exec, nautilus
bind = SUPER, W, exec, firefox
bind = , XF86Explorer, exec, nautilus
bind = , XF86HomePage, exec, firefox
bind = , XF86WWW, exec, firefox
bind = , XF86Calculator, exec, mate-calc

# Screenshots (all your Print variants)
bind = , Print, exec, $HOME/.config/scripts/screenshot.sh
bind = SHIFT, Print, exec, $HOME/.config/scripts/screenshot.sh
bind = ALT, Print, exec, $HOME/.config/scripts/screenshot.sh
bind = CTRL, Print, exec, $HOME/.config/scripts/screenshot.sh
bind = CTRL ALT, Print, exec, $HOME/.config/scripts/screenshot.sh
bind = CTRL SHIFT, Print, exec, $HOME/.config/scripts/screenshot.sh
bind = ALT SHIFT, S, exec, $HOME/.config/scripts/screenshot.sh

# Window control (from xfwm4)
bind = ALT, F4, closeactivewindow
bind = ALT, F11, togglefullscreen,
bind = CTRL ALT, Escape, killactivewindow,
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cycleprev
bind = SUPER, Tab, cyclenext
bind = SUPER, G, togglefloating,
bind = CTRL SHIFT, Escape, exec, btop
bind = SUPER, Q, closeactivewindow

# Workspaces
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9

# Move window to workspace (your Alt+1..7)
bind = ALT, 1, movetoworkspace, 1
bind = ALT, 2, movetoworkspace, 2
bind = ALT, 3, movetoworkspace, 3
bind = ALT, 4, movetoworkspace, 4
bind = ALT, 5, movetoworkspace, 5
bind = ALT, 6, movetoworkspace, 6
bind = ALT, 7, movetoworkspace, 7

# Session / power — your original lock keys now lock the screen
bind = CTRL ALT, Delete, exec, $HOME/.config/scripts/power-menu.sh
bind = CTRL ALT, L, exec, $HOME/.config/scripts/lock.sh
bind = SUPER, L, exec, $HOME/.config/scripts/lock.sh
bind = SUPER, Escape, exit,

# Rice extras
bind = SUPER, P, exec, $HOME/.config/scripts/wallpaper.sh
bind = SUPER, M, exec, mpv
bind = SUPER ALT, R, exec, hyprctl reload

# Mouse
mousebind = SUPER, Left, movewindow
mousebind = SUPER, Right, resizewindow

# Media keys
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# ── Environment ────────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland

source = $HOME/.config/hypr/user.conf
