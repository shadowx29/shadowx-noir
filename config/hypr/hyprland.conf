# ═══════════════════════════════════════════════════════════════
#  SHADOWX // NOIR — complete Kali desktop rice
#  Hyprland 0.56.x (classic config) · Intel iGPU friendly
#  Keybindings: your existing XFCE shortcuts + desktop extras
# ═══════════════════════════════════════════════════════════════

# ── Autostart ──────────────────────────────────────────────────
exec-once = waybar
exec-once = swaybg -i $HOME/.config/shadowx/wallpaper.current -m fill
exec-once = dunst
exec-once = swayidle -w timeout 300 "$HOME/.config/scripts/lock.sh" timeout 600 "hyprctl dispatch dpms off" resume "hyprctl dispatch dpms on" &
exec-once = polkit-kde-authentication-agent-1 &
exec-once = nm-applet --indicator &
exec-once = cliphist-watch &

# ── Look (from the original) ───────────────────────────────────
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 1
    col.active_border = rgba(cc1515ff)
    col.inactive_border = rgba(1a1814aa)
    layout = dwindle
}

decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = true
    bezier = shadowx, 0.4, 0, 0.2, 1
    animation = windows, 1, 4, shadowx, slide
    animation = windowsOut, 1, 3, shadowx, slide
    animation = fade, 1, 4, shadowx
    animation = workspaces, 1, 5, shadowx, slidevert
}

dwindle {
    preserve_split = true
}

master {
    new_status = master
    mfact = 0.55
}

input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
        tap-to-click = true
    }
}

misc {
    disable_hyprland_logo = true
    vrr = 0
    allow_session_lock_restore = true
}


# ── Environment ────────────────────────────────────────────────
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = PATH,$HOME/.local/bin:/usr/local/bin:/usr/bin:/bin

# ── Keys — YOUR shortcuts (from XFCE) ─────────────────────────
# Menus / run
bind = ALT, F1, exec, rofi -show drun -theme $HOME/.config/rofi/sidonia.rasi
bind = ALT, F3, exec, rofi -show drun -theme $HOME/.config/rofi/sidonia.rasi
bind = ALT, F2, exec, rofi -show run -theme $HOME/.config/rofi/sidonia.rasi
bind = CTRL, Escape, exec, rofi -show drun -theme $HOME/.config/rofi/sidonia.rasi
bind = SUPER, R, exec, rofi -show run -theme $HOME/.config/rofi/sidonia.rasi
bind = SUPER, Space, exec, rofi -show drun -theme $HOME/.config/rofi/sidonia.rasi
bind = SUPER, F1, exec, xdotool mousemove 960 540

# Terminal (your Ghostty, untouched)
bind = CTRL ALT, T, exec, ghostty --gtk-single-instance=true
bind = CTRL SHIFT ALT, T, exec, ghostty --gtk-single-instance=true
bind = SUPER, Return, exec, ghostty --gtk-single-instance=true
bind = SUPER, T, exec, ghostty --gtk-single-instance=true

# Apps
bind = CTRL ALT, F, exec, nautilus
bind = SUPER, E, exec, nautilus
bind = SUPER, F, exec, nautilus
bind = SUPER, W, exec, firefox
bind = , XF86Explorer, exec, nautilus
bind = , XF86HomePage, exec, firefox
bind = , XF86WWW, exec, firefox
bind = , XF86Calculator, exec, mate-calc
bind = SUPER, M, exec, mpv

# Screenshots (your Print variants)
bind = , Print, exec, $HOME/.config/scripts/screenshot.sh --region
bind = SHIFT, Print, exec, $HOME/.config/scripts/screenshot.sh --region
bind = ALT, Print, exec, $HOME/.config/scripts/screenshot.sh --window
bind = CTRL, Print, exec, $HOME/.config/scripts/screenshot.sh --full
bind = CTRL ALT, Print, exec, $HOME/.config/scripts/screenshot.sh --window
bind = CTRL SHIFT, Print, exec, $HOME/.config/scripts/screenshot.sh --region
bind = ALT SHIFT, S, exec, $HOME/.config/scripts/screenshot.sh --region

# Window control
bind = CTRL ALT, Escape, killactive
bind = ALT, F4, killactive
bind = SUPER, Q, killactive
bind = SUPER, F, fullscreen,
bind = SUPER, D, fullscreen, maximized
bind = SUPER, V, togglefloating,
bind = SUPER, Escape, exit,
bind = CTRL SHIFT, Escape, exec, btop
bind = ALT, Tab, cyclenext
bind = ALT SHIFT, Tab, cyclenext, prev

# Workspaces (yours: Super+1..9 switch, Alt+1..7 move window)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = ALT, 1, movetoworkspace, 1
bind = ALT, 2, movetoworkspace, 2
bind = ALT, 3, movetoworkspace, 3
bind = ALT, 4, movetoworkspace, 4
bind = ALT, 5, movetoworkspace, 5
bind = ALT, 6, movetoworkspace, 6
bind = ALT, 7, movetoworkspace, 7

# Focus / move
bind = SUPER, Left, focuswindow, l
bind = SUPER, Right, focuswindow, r
bind = SUPER, Up, focuswindow, u
bind = SUPER, Down, focuswindow, d
bind = SUPER SHIFT, Left, movewindow, l
bind = SUPER SHIFT, Right, movewindow, r
bind = SUPER SHIFT, Up, movewindow, u
bind = SUPER SHIFT, Down, movewindow, d
bind = SUPER, mouse_down, workspace, e+1
bind = SUPER, mouse_up, workspace, e-1
mousebind = SUPER, Left, movewindow
mousebind = SUPER, Right, resizewindow

# ── Desktop extras ──────────────────────────────────────────────
bind = SUPER, Tab, exec, $HOME/.config/scripts/control-center.sh
bind = SUPER, N, exec, $HOME/.config/scripts/notes.sh
bind = SUPER, C, exec, $HOME/.config/scripts/clipboard.sh
bind = SUPER SHIFT, Return, exec, $HOME/.config/scripts/player.sh

# Lock / power
bind = CTRL ALT, L, exec, $HOME/.config/scripts/lock.sh
bind = SUPER, L, exec, $HOME/.config/scripts/lock.sh
bind = CTRL ALT, Delete, exec, $HOME/.config/scripts/power-menu.sh

# Rice
bind = SUPER, P, exec, $HOME/.config/scripts/wallpaper.sh
bind = SUPER ALT, R, exec, hyprctl reload

# Hardware keys
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Personal overrides (never replaced)
source = $HOME/.config/hypr/user.conf
